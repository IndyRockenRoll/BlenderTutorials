<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="crystal-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#baf8ff"/>
      <stop offset="0.45" stop-color="#31d9ee"/>
      <stop offset="1" stop-color="#2877ff"/>
    </linearGradient>
    <linearGradient id="crystal-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#73eaf7" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- A soft halo that remains inexpensive for Godot to render. -->
  <circle cx="64" cy="64" r="57" fill="#23d5e8" opacity="0.12"/>

  <!-- Outer crystal silhouette. -->
  <path d="M64 8 L106 42 L88 105 L64 121 L40 105 L22 42 Z"
        fill="url(#crystal-main)" stroke="#123b82" stroke-width="4" stroke-linejoin="round"/>

  <!-- Facets. -->
  <path d="M64 8 L64 121 L40 105 L22 42 Z" fill="#20bad8" opacity="0.55"/>
  <path d="M64 8 L106 42 L88 105 L64 121 Z" fill="#276bdf" opacity="0.48"/>
  <path d="M22 42 L64 8 L49 45 Z" fill="url(#crystal-light)"/>
  <path d="M49 45 L64 8 L79 45 L64 101 Z" fill="#9ef5ff" opacity="0.76"/>
  <path d="M22 42 L49 45 L64 101 L40 105 Z" fill="#4ee3ef" opacity="0.52"/>
  <path d="M79 45 L106 42 L88 105 L64 101 Z" fill="#174ec6" opacity="0.46"/>

  <!-- Facet lines and highlight. -->
  <path d="M22 42 L49 45 L64 101 L79 45 L106 42 M49 45 L64 8 M79 45 L64 8"
        fill="none" stroke="#e9fdff" stroke-width="2" stroke-opacity="0.68" stroke-linejoin="round"/>
  <path d="M42 35 L56 22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
</svg>
